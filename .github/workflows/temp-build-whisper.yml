name: Temporary Whisper Tools
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download medium English model
        run: |
          mkdir -p /tmp/package
          curl -L --fail --retry 4 --retry-delay 5 \
            -o /tmp/package/ggml-medium.en-q5_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium.en-q5_0.bin
          tar -C /tmp/package -czf /tmp/whisper-medium-model.tar.gz .
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-medium-en-q5
          path: /tmp/whisper-medium-model.tar.gz
          retention-days: 1
